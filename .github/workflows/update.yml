name: Update profile

on:
  schedule:
    - cron: "0 6 * * *" # every day, 3am in buenos aires
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-profile

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Latest blog posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: https://4st.li/blog/index.xml
          max_post_count: 3
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "yyyy-mm-dd"
          tag_post_pre_newline: true
          item_exec: post.url = post.url.replace("://4st.li/en/", "://4st.li/")
          skip_commit: true
          enable_keepalive: false

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=astrovm&show_icons=true&include_all_commits=true&hide_border=true&bg_color=211f2b&title_color=f462c6&icon_color=f462c6&text_color=eceae5&ring_color=f462c6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=astrovm&layout=compact&langs_count=8&hide_border=true&bg_color=211f2b&title_color=f462c6&text_color=eceae5
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: astrovm
          outputs: |
            profile/snake.svg?color_snake=#f462c6&color_dots=#2c2938,#5a2f52,#8e3a78,#c24c9f,#f462c6

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile
          git diff --cached --quiet && exit 0
          git commit -m "Update profile"
          git push
